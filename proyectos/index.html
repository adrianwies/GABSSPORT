<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos | GABSPORT</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../componentes/header/header.css" />
    <link rel="stylesheet" href="../componentes/footer/footer.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=keyboard_double_arrow_up"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="../img/años.png" />
    <link rel="stylesheet" href="../css/typography.css" />
    <link rel="stylesheet" href="../css/stylepr.css" />
    <link rel="stylesheet" href="../componentes/loader/loader.css" />
    <script src="../componentes/loader/loader.js"></script>
  </head>

  <body>
    <gabs-loader data-base="../" data-mode="delayed"></gabs-loader>

    <div id="site-header" data-base="../" data-active="proyectos"></div>

    <section class="proyecto-banner">
      <div class="proyecto-content">
        <span>NUESTROS PROYECTOS</span>
        <h1>
          PROYECTOS QUE
          <br />
          <strong>MARCAN LA DIFERENCIA</strong>
        </h1>
        <p>
          Cada proyecto refleja nuestro compromiso con la calidad, la innovación
          y la satisfacción de nuestros clientes.
        </p>
      </div>
    </section>

    <section class="proyectos-section">
      <div class="proyectos-header">
        <span>NUESTROS PROYECTOS</span>
        <h2>Proyectos que transforman espacios deportivos</h2>

        <div class="filtros-navegacion">
          <button class="filtros-flecha filtros-flecha--prev" type="button" aria-label="Ver filtros anteriores">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>

          <div class="proyectos-filtros" aria-label="Filtrar proyectos">
          <button class="filtro-btn active" type="button" data-filter="all">
            <i class="fa-solid fa-border-all" aria-hidden="true"></i>
            TODOS
          </button>
          <button class="filtro-btn" type="button" data-filter="futbol">
            <i class="fa-regular fa-futbol" aria-hidden="true"></i>
            CANCHAS
          </button>
          <button class="filtro-btn" type="button" data-filter="pistas">
            <i class="fa-solid fa-person-running" aria-hidden="true"></i>
            PISTAS
          </button>
          <button class="filtro-btn" type="button" data-filter="recreativos">
            <i class="fa-solid fa-children" aria-hidden="true"></i>
            RECREATIVOS
          </button>
          <button class="filtro-btn" type="button" data-filter="luces">
            <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>
            LUCES
          </button>
          <button class="filtro-btn" type="button" data-filter="mantenimiento">
            <i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>
            MANTENIMIENTO
          </button>
          </div>

          <button class="filtros-flecha filtros-flecha--next" type="button" aria-label="Ver más filtros">
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="proyectos-grid" aria-live="polite"></div>

      <div class="proyectos-more">
        <button class="ver-mas-proyectos" id="verMasProyectos" type="button">
          VER MÁS PROYECTOS
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <div id="site-footer" data-base="../"></div>

    <a href="#" class="scroll-top" id="scrollTop" aria-label="Volver arriba">
      <span class="material-symbols-outlined" aria-hidden="true">
        keyboard_double_arrow_up
      </span>
    </a>

    <script src="../componentes/header/header.js"></script>
    <script src="../componentes/footer/footer.js"></script>
    <script src="../js/scrippr.js"></script>
  </body>
</html>
